<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tania cafe brand banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241003"/>
      <stop offset="0.5" stop-color="#4a2410"/>
      <stop offset="1" stop-color="#7c4a1e"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.24" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#e8a24a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e8a24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cream" cx="0.8" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#f5efe6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f5efe6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#warm)"/>
  <rect width="1600" height="640" fill="url(#cream)"/>

  <!-- Coffee ring stains -->
  <g fill="none" stroke="#f5efe6" stroke-opacity="0.12" stroke-width="3">
    <circle cx="320" cy="180" r="60"/>
    <circle cx="360" cy="200" r="42" stroke-opacity="0.08"/>
    <circle cx="1240" cy="140" r="48"/>
    <circle cx="1290" cy="170" r="30" stroke-opacity="0.08"/>
  </g>

  <!-- Rising steam curves -->
  <g fill="none" stroke="#f5efe6" stroke-opacity="0.2" stroke-width="6" stroke-linecap="round">
    <path d="M 700 420 C 670 360 730 330 700 270 C 680 230 710 200 700 160"/>
    <path d="M 800 440 C 770 380 830 350 800 290 C 780 250 810 220 800 180"/>
    <path d="M 900 420 C 870 360 930 330 900 270 C 880 230 910 200 900 160"/>
  </g>

  <!-- Cup rim arc -->
  <g fill="none" stroke="#f5efe6" stroke-opacity="0.3" stroke-width="5">
    <ellipse cx="800" cy="470" rx="180" ry="52"/>
    <ellipse cx="800" cy="470" rx="140" ry="36" stroke-opacity="0.14"/>
  </g>

  <!-- Beans -->
  <g fill="#2a1206" opacity="0.5">
    <ellipse cx="1180" cy="480" rx="26" ry="16" transform="rotate(-24 1180 480)"/>
    <ellipse cx="1240" cy="520" rx="26" ry="16" transform="rotate(18 1240 520)"/>
    <ellipse cx="380" cy="500" rx="26" ry="16" transform="rotate(-40 380 500)"/>
  </g>
  <g stroke="#f5efe6" stroke-opacity="0.25" stroke-width="2" fill="none">
    <path d="M 1160 484 q 20 -12 40 -8"/>
    <path d="M 1222 516 q 20 -12 40 -8"/>
    <path d="M 362 506 q 20 -12 40 -8"/>
  </g>

  <!-- Bottom vignette -->
  <rect y="440" width="1600" height="200" fill="#1a0c02" opacity="0.55"/>
  <rect y="440" width="1600" height="2" fill="#f5efe6" opacity="0.12"/>
</svg>
